name: Build

on:
  workflow_dispatch:

  push:
    branches:
      - main

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        id: checkout
        uses: actions/checkout@v4

      - id: date
        run: |
          echo "today=$(date +'%Y-%m-%d')" >> $GITHUB_ENV

      - name: Login to Docker Hub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - id: build
        name: Build and push
        uses: docker/build-push-action@v4
        with:
          context: .
          push: true
          tags: apwide/k8s-golive-monitor:latest,apwide/k8s-golive-monitor:${{ env.today }}-${{ steps.commit.outputs.short }}

