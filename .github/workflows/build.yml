name: Build

on:
  push:
#    branches:
#      - main

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - id: checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - id: commit
        uses: pr-mpt/actions-commit-hash@v2

      - id: version
        if: ${{ github.ref == 'refs/heads/main' }}
        uses: paulhatch/semantic-version@v5.3.0
        with:
          tag_prefix: ""

      - id: date
        run: |
          echo "today=$(date +'%Y-%m-%d')" >> $GITHUB_ENV

      - id: create-tag
        uses: actions/github-script@v5
        if: ${{ github.ref == 'refs/heads/main' }}
        with:
          script : |
            github.rest.git.createRef({
              owner: context.repo.owner,
              repo: context.repo.repo,
              ref: 'refs/tags/${{steps.version.outputs.version}}',
              sha: context.sha
            })

#      - id: release
#        uses: softprops/action-gh-release@v2

      - id: login-dockerhub
        if: ${{ github.ref == 'refs/heads/main' || github.ref == 'refs/heads/develop' }}
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - id: build
        name: Build and push
        uses: docker/build-push-action@v4
        with:
          context: .
          push: ${{ github.ref == 'refs/heads/main' || github.ref == 'refs/heads/develop' }}
          tags: |
            apwide/k8s-golive-monitor:latest
            apwide/k8s-golive-monitor:${{ steps.version.outputs.version != '' && steps.version.outputs.version || format('{0}-{1}', env.today, steps.commit.outputs.short) }}

