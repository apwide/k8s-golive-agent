statusMapping:
  down:
    name: Down
  up:
    name: Up
  deploy:
    name: Deploy
  failed:
    name: Down

listeners:
  - id: golive-api
    autoCreate: true
    category:
    # application => from docker image
    deployment:
      versionName: "CLOUD-{{ mainImageTag }}"
    environment:
      name: "{{ .App.Name }} {{ .Cat.Name | lower }}"
      attributes:
        - name: Cluster
          value: "Local"
        - name: "# servers"
          value: |
            {{ jsonPath ".spec.replicas" }}
        - name: "Deployment Mode"
          value: |
            {{ jsonPath ".spec.template.spec.containers[0].env[?(@.name=="APWIDE_DEPLOYMENT-MODE")].value" }}
        # use templating to extract database name
        - name: "Database"
          value: |
            {{ jsonPath ".spec.template.spec.containers[0].env[?(@.name=="SPRING_DATASOURCE_URL")].value" }}
        - name: "Base URL"
          value: |
            {{ jsonPath ".spec.template.spec.containers[0].env[?(@.name=="ADDON_BASE-URL")].value" }}
    selectors:
      - namespace: golive-local
        labelQuery: "apwide.net/app in (golive-api, golive-api-async)"
  - id: golive-local
    autoCreate: true
    category:
      name: "Local" # id vs name
    environment:
      name: |
        {{ .App.Name }} {{ .Cat.Name | lower }}
      attributes:
        - name: Cluster
          value: "Local"
        - name: "# servers"
          fromPath: ".spec.replicas"
    selectors:
      - namespace: golive-local
        labelQuery: "apwide.net/app in (golive-web, atlassian-host, gateway)"
