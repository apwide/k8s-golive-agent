# statusMapping maps K8S pod status to Golive Status
# Golive statuses can be defined by id and/or by name
# When no statusMapping is configured, pod statuses are not tracked.
#statusMapping:
#  down:
#    name: Down
#  up:
#    name: Up
#  deploy:
#    name: Deploy
#  failed:
#    name: Down

# listeners defines what pod to watch (using selectors) and how to extract and push information to Golive
# at least 1 listener is mandatory
listeners:
