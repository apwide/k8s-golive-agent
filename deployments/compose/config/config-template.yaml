#      # annotation can also be used to extract category. Same policy than for labels, search on pod's or if namespace=true, look for annotation from namespace.
#      # annotation: my.company.com/category
#    # application configure how to extract Golive application from the listened pod.
#    # when no configuration is provided, the operator search for "golive.apwide.net/app" label or annotation to extract application to use
#    # in addition to configuration, the operator is going to fallback on main container image to extract application information.
