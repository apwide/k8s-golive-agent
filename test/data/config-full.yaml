golive:
  url: https://jre.apwide.net/api # fallback on cloud prod
  # basic auth for non cloud ?
  token: ""
  offline: false
  yaml: false
listeners:
  - id: golive-dev
    autoCreate: true
    selectors:
      - namespace: golive-dev
        labelQuery: "app in (golive)"
        labels:
          golive.apwide.net/app: golive-api
          golive.apwide.net/cat: Dev
    environment:
      url: "{{ defaultAnnotation }}"
      name: "Golive Dev 1"
      attributes:
        - name: Cluster
          value: DEV
        - name: Namespace
          value: "{{ $.metadata.namespace }}"
        - name: Deployment Mode
          value: $.spec.template.spec.containers[0].env[?(@.name=="APWIDE_DEPLOYMENT-MODE")].value
    category:
      name: |
        {{ nsLabel "my.company.com/cat" }}
    application:
      name: |
        {{ annotation "my.company.com/app" }}
